{% extends "email/layout.html" %}
{% block content %}
<p style="margin:0 0 14px;">Olá, <b>{{ name }}</b>!</p>
<p style="margin:0 0 18px;">{{ intro }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;border:1px solid #e3e8f4;border-radius:10px;background:#f8f9fd;">
  <tr><td style="padding:14px 18px;border-bottom:1px solid #e3e8f4;font-size:13px;color:#667090;width:32%;">Endereço</td><td style="padding:14px 18px;border-bottom:1px solid #e3e8f4;"><a href="{{ url }}" style="color:#1e73f8;text-decoration:none;font-weight:600;">{{ url }}</a></td></tr>
  <tr><td style="padding:14px 18px;border-bottom:1px solid #e3e8f4;font-size:13px;color:#667090;">Usuário</td><td style="padding:14px 18px;border-bottom:1px solid #e3e8f4;font-weight:600;">{{ email }}</td></tr>
  <tr><td style="padding:14px 18px;border-bottom:1px solid #e3e8f4;font-size:13px;color:#667090;">Senha temporária</td><td style="padding:14px 18px;border-bottom:1px solid #e3e8f4;"><code style="font-family:Consolas,monospace;font-size:15px;background:#fff;border:1px solid #d6dcee;padding:3px 9px;border-radius:6px;">{{ password }}</code></td></tr>
  <tr><td style="padding:14px 18px;font-size:13px;color:#667090;">Perfil</td><td style="padding:14px 18px;font-weight:600;">{{ role }}</td></tr>
</table>
<p style="margin:0 0 6px;padding:12px 16px;background:#fff7e6;border-left:4px solid #e0a800;border-radius:0 8px 8px 0;font-size:14px;">🔒 Por segurança, <b>altere a senha no primeiro acesso</b> e não compartilhe estas credenciais.</p>
<p style="margin:22px 0 6px;"><a href="{{ url }}" style="display:inline-block;background:#1e73f8;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:10px;">Acessar a NAVI</a></p>
{% endblock %}
